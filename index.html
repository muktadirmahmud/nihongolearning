<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f6f2">
    <meta name="description" content="A calm, offline-ready Japanese vocabulary study space.">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./style.css">
    <title>Kotoba — Japanese study</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="Kotoba home">
          <span class="brand-mark" aria-hidden="true">言</span>
          <span>Kotoba<span class="brand-period">.</span></span>
        </a>
        <div class="topbar-actions">
          <span class="offline-indicator" id="connection-status">Online</span>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
            <span aria-hidden="true">☾</span>
          </button>
        </div>
      </header>

      <main id="main-content" tabindex="-1"></main>

      <nav class="bottom-nav" aria-label="Main navigation">
        <button class="nav-item is-active" data-route="home" type="button"><span aria-hidden="true">⌂</span><small>Home</small></button>
        <button class="nav-item" data-route="learn" type="button"><span aria-hidden="true">文</span><small>Lessons</small></button>
        <button class="nav-item" data-route="quiz" type="button"><span aria-hidden="true">✳</span><small>Quiz</small></button>
        <button class="nav-item" data-route="review" type="button"><span aria-hidden="true">↺</span><small>Review</small></button>
        <button class="nav-item" data-route="progress" type="button"><span aria-hidden="true">▥</span><small>Progress</small></button>
      </nav>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
